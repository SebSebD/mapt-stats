# Relevé automatique des statistiques : GitHub lance stats-bunny.py, qui lit les journaux de Bunny, met à jour les
# totaux (stats.json) et le rapport (index.html), puis les enregistre dans ce dépôt.
# Il faut avoir créé 3 « Secrets » : BUNNY_API_KEY, BUNNY_PULLZONE_ID, MAPT_STATS_SALT (voir LISEZMOI.md).
#
# REMISE À ZÉRO : onglet Actions > Relevé des statistiques > Run workflow, puis taper REMISE A ZERO dans la case.
# Laissée vide, la case ne change rien : c'est un relevé normal.
name: Relevé des statistiques

on:
  schedule:
    - cron: '47 5,13,21 * * *'   # 3 fois par jour (05h47, 13h47, 21h47 UTC) : si GitHub en retarde ou en saute un, le suivant rattrape
  workflow_dispatch:
    inputs:
      remise_a_zero:
        description: 'LAISSER VIDE pour un relevé normal. Pour EFFACER toutes les statistiques, taper exactement : REMISE A ZERO'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: releve-stats
  cancel-in-progress: false

jobs:
  releve:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Relever les journaux Bunny et fabriquer le rapport (ou remettre à zéro)
        env:
          BUNNY_API_KEY: ${{ secrets.BUNNY_API_KEY }}
          BUNNY_PULLZONE_ID: ${{ secrets.BUNNY_PULLZONE_ID }}
          MAPT_STATS_SALT: ${{ secrets.MAPT_STATS_SALT }}
          MAPT_STATS_DIR: ${{ github.workspace }}
          MAPT_REPORT_NAME: index.html
          REMISE: ${{ github.event.inputs.remise_a_zero }}
        run: |
          if [ -n "$REMISE" ]; then
            python3 stats-bunny.py --sans-ouvrir --remise-a-zero --confirmer "$REMISE"
          else
            python3 stats-bunny.py --sans-ouvrir
          fi

      - name: Enregistrer les nouveaux totaux
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json index.html
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Relevé du $(date -u +%F)"
            git push origin HEAD
          fi
